<!doctype html>
<html lang="en" data-view="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Breath orb demo</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/chrome.css">
  <link rel="stylesheet" href="../css/backdrop.css">
  <style>
    .demo-bar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: var(--step); }
    .demo-bar label { font-family: var(--font-display); font-size: var(--fs-small); color: var(--ink-soft); }
    .demo-bar select { font: inherit; background: var(--field-bg); color: var(--ink); border: 1px solid var(--field-border); padding: 0.4rem 0.6rem; }
    .demo-log { font-family: var(--font-display); font-size: var(--fs-small); color: var(--ink-soft); min-height: 1.5em; }
  </style>
</head>
<body>
  <header id="site-header" class="siteheader"></header>

  <div class="frame">
    <main id="screen" class="screen" tabindex="-1">
      <section class="screen-panel">
        <span class="card__label">Demo</span>
        <h1 class="card__q">Box breathing, one step.</h1>
        <div class="demo-bar">
          <label for="mood">Mood</label>
          <select id="mood">
            <option value="arrive">arrive</option>
            <option value="breathe" selected>breathe</option>
            <option value="think">think</option>
            <option value="plan">plan</option>
          </select>
          <button type="button" class="btn btn--ghost" id="mode-ring">Ring instead</button>
          <button type="button" class="btn btn--ghost" id="restart">Restart</button>
        </div>
        <div id="host"></div>
        <p class="demo-log" id="log" aria-live="off"></p>
      </section>
    </main>
  </div>

  <footer id="site-footer" class="sitefooter"></footer>

  <script type="module">
    import { renderHeader, renderFooter } from "./chrome.js";
    import { initBackdrop, setMood } from "./backdrop.js";
    import { mountBreath } from "./breath.js";

    document.getElementById("site-header").replaceChildren(renderHeader());
    document.getElementById("site-footer").replaceChildren(renderFooter());
    initBackdrop();
    setMood("breathe");

    const boxStep = {
      id: "demo-box", type: "timer", header: "Breathe", title: "Box breathing",
      instruction: "Four in, four hold, four out, four rest.",
      seconds: 40,
      pattern: { inhale: 4, hold1: 4, exhale: 4, hold2: 4 },
      cues: [], next: "_end"
    };
    const ringStep = {
      id: "demo-ring", type: "timer", header: "Ground", title: "Feet on the floor",
      instruction: "Press both feet into the floor. Notice the weight in the heels.",
      seconds: 45, pattern: null,
      cues: ["Let the jaw hang a little.", "Shoulders down, away from the ears.", "Longer out-breath than in."],
      next: "_end"
    };

    const host = document.getElementById("host");
    const log = document.getElementById("log");
    let current = null;
    let useRing = false;

    function start() {
      if (current) current.stop();
      host.replaceChildren();
      log.replaceChildren(document.createTextNode(""));
      current = mountBreath(host, useRing ? ringStep : boxStep, {
        onDone: function () {
          log.replaceChildren(document.createTextNode("done"));
        },
        onTick: function (info) {
          log.replaceChildren(document.createTextNode(
            info.phase + " " + info.t.toFixed(2) + " · " + Math.ceil(info.remaining) + " s left"
          ));
        }
      });
    }

    document.getElementById("mood").addEventListener("change", function (e) {
      setMood(e.target.value);
    });
    document.getElementById("mode-ring").addEventListener("click", function (e) {
      useRing = !useRing;
      e.target.replaceChildren(document.createTextNode(useRing ? "Orb instead" : "Ring instead"));
      start();
    });
    document.getElementById("restart").addEventListener("click", start);

    start();
  </script>
</body>
</html>
